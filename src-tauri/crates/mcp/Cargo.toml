[package]
name = "midiss-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing the midiss song library to Claude"

[[bin]]
name = "midiss-mcp"
path = "src/main.rs"

[dependencies]
midiss-score = { path = "../score" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
