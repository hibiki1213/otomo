[package]
name = "otomo-mcp"
version = "0.1.2"
edition = "2021"
authors = ["Hibiki Kawabe"]
license = "MIT"
description = "MCP server exposing the Otomo song library to Claude"

[[bin]]
name = "otomo-mcp"
path = "src/main.rs"

[dependencies]
otomo-score = { path = "../score" }
reqwest = { version = "0.13.3", default-features = false, features = ["native-tls", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.11"
base64 = "0.23"
png = "0.18"

# Rendering PDF and scanned scores for the model to read.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
