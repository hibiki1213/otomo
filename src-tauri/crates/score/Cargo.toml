[package]
name = "midiss-score"
version = "0.1.0"
edition = "2021"
description = "Bars, beats and note names for a Standard MIDI File"

[dependencies]
midly = { version = "0.5.3", default-features = false, features = ["std"] }
roxmltree = "0.20"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
