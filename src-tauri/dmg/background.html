<!doctype html>
<!--
  Source of the DMG window background. Rendered to background.tiff by
  scripts/build-dmg-background.sh. The icons and their labels are drawn by
  Finder at the positions set in tauri.conf.json (bundle.macOS.dmg), so keep
  the arrow between those two points when changing either.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    background: #f6f7f9;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  svg.arrow { position: absolute; left: 0; top: 0; }
  .caption {
    position: absolute; left: 0; right: 0; margin: 0;
    text-align: center; font-size: 16px; font-weight: 500; color: #8c93a3;
    letter-spacing: 0.1px;
  }
  .caption b { color: #1d1f24; font-weight: 500; }
  .drag { top: 270px; }
  .req { top: 300px; font-size: 15px; }
</style>
</head>
<body>
  <!-- App icon centre: (170, 150). Applications centre: (490, 150). -->
  <svg class="arrow" width="660" height="400" viewBox="0 0 660 400">
    <line x1="268" y1="150" x2="378" y2="150" stroke="#cdd2dc" stroke-width="5" stroke-linecap="round"/>
    <path d="M374 137 L394 150 L374 163 Z" fill="#cdd2dc" stroke="#cdd2dc" stroke-width="4" stroke-linejoin="round"/>
  </svg>
  <p class="caption drag">Drag and Drop <b>Otomo</b> to the <b>Applications</b> folder</p>
  <p class="caption req">Otomo requires macOS 11.0 or greater</p>
</body>
</html>
