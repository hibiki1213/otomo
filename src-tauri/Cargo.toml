[workspace]
members = ["crates/mcp"]
# Vendored upstream: still built as a dependency, but its own test suite wants
# SoundFont fixtures we do not ship, so it is not ours to run.
exclude = ["crates/rustysynth"]

[package]
name = "otomo"
version = "0.1.1"
description = "Desktop music editor where Claude composes alongside you"
authors = ["Hibiki Kawabe"]
license = "MIT"
repository = "https://github.com/hibiki1213/otomo"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "otomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cmake = "0.1.58"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["fs"] }
rustysynth = { path = "crates/rustysynth" }
cpal = "0.17.1"
realfft = "3.5.0"
futures-util = "0.3.34"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
tauri-plugin-dialog = "2.7.3"
reqwest = { version = "0.13.3", default-features = false, features = ["native-tls", "stream", "http2"] }
tauri-plugin-opener = "2.5.5"
rtrb = "0.4.0"
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
otomo-score = { path = "crates/score" }
otomo-synth = { path = "crates/synth" }
# Sheet-music PDF: the engraved SVG pages, as vector pages. usvg must be the
# version krilla-svg is built on.
krilla = { version = "0.8.2", default-features = false }
krilla-svg = "0.8.1"
usvg = "0.47.0"
ttf-parser = "0.25.1"
wuff = { version = "0.2.9", default-features = false, features = ["brotli"] }
base64 = "0.22.1"
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3.1"

# The synth runs on the realtime audio thread; unoptimized it can barely keep
# up with dense arrangements, so optimize it (and the engine) even in dev.
[profile.dev.package.rustysynth]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

# Built-in synth voices run per sample on the audio thread, like rustysynth.
[profile.dev.package.otomo-synth]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-audio-toolbox = "0.3.2"
objc2-avf-audio = "0.3.2"
objc2-core-audio-kit = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
