# cargo-about settings for scripts/generate-licenses.mjs, which turns the
# crates' licenses into the app's THIRD_PARTY_LICENSES.html. A crate under a
# license missing here fails the build, so a new copyleft dependency is noticed
# rather than shipped silently.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
# The app is macOS-only.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Neither ships in the app.
ignore-build-dependencies = true
ignore-dev-dependencies = true
